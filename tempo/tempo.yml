server:
  http_listen_port: 3200

compactor:
  compaction:
    compaction_window: 1h
    block_retention: 336h # 14 days (14 * 24h) retention policy for traces

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

distributor:
  log_received_spans:
    enabled: true
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
