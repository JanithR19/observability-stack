auth_enabled: false # Disabled multi-tenancy mode to allow single-tenant deployments on Railway

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory # Uses in-memory state coordination

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 48h # Restricts deep storage retention window to prevent disk bloating

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true # Enables automatic cleanups based on retention limits
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

schema_config:
  configs:
    - from: 2025-01-01
      index:
        period: 24h
        prefix: index_
      store: tsdb # Uses single-store TSDB indexing schemas
      object_store: filesystem # Saves indexed logs locally on the attached volume mount
      schema: v13

storage_config:
  filesystem:
    directory: /loki/chunks # Directory path where raw log chunks are preserved
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index # Hot index directory
    cache_location: /loki/tsdb-cache # Local query indexes cache

