global:
  scrape_interval: 15s # Default rate at which Prometheus pulls metrics from target endpoints

scrape_configs:
  # Self-monitoring job for Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrapes internal runtime/operational stats from Grafana Alloy OTel collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:12345"]

  # Scrapes performance and operational metrics from the Grafana Loki log engine
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # Scrapes distributed tracing metadata and ingestion performance metrics from Grafana Tempo
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  # Scrapes native /metrics endpoints via Gateway
  - job_name: "ai-services"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets: ["api-gateway-dev-1f8e.up.railway.app:443"]
        labels:
          service: "ai-auth-service"
          __metrics_path__: "/auth/metrics"
      - targets: ["api-gateway-dev-1f8e.up.railway.app:443"]
        labels:
          service: "ai-portal-service"
          __metrics_path__: "/portal/metrics"
      
